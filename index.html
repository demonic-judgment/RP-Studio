<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="violet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RP-Studio · 角色扮演工作室</title>
    <script>
      // 首屏前恢复主题，避免闪烁
      try {
        var t = localStorage.getItem("rp.theme") || "system";
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0d0d0f" : "#f8f7f4");
        var a = localStorage.getItem("rp.accent");
        if (a) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

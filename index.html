<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="violet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RP-Studio · 角色扮演工作室</title>
    <script>
      // 首屏前恢复主题，避免闪烁
      try {
        var t = localStorage.getItem("rp.theme") || "system";
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0d0d0f" : "#f8f7f4");
        var a = localStorage.getItem("rp.accent");
        if (a) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
    <script>
      // 部署新版本后，浏览器里的旧 index.html 会去请求已经被删掉的旧 chunk：
      // 模块 404 或 MIME 不对，React 永远挂不上，整页空白。
      // 这里在入口脚本加载失败时带一个随机 query 重载一次 —— query 变了就是新的
      // 缓存键，能绕开浏览器里的旧 HTML。成功后由 main.tsx 清掉这个标记。
      (function () {
        var KEY = "rp.asset-reload";
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (!t || t.tagName !== "SCRIPT" || !t.src) return;
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, "1");
            } catch (_) {}
            var u = new URL(location.href);
            u.searchParams.set("v", Date.now().toString(36));
            location.replace(u.toString());
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

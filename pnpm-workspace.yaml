# pnpm 10（Cloudflare 构建镜像默认版本）要求这个文件里必须有 packages，
# 否则 `pnpm install --frozen-lockfile` 会直接报 "packages field missing or empty"。
# 本项目是单包仓库，写 "." 即可。
packages:
  - "."

# 允许执行安装脚本的依赖：pnpm 10 读 onlyBuiltDependencies，pnpm 11+ 改名为
# allowBuilds，两个键都留着，各版本各读各的，免得换环境后 esbuild / workerd
# 的脚本被静默跳过。
onlyBuiltDependencies:
  - esbuild
  - workerd

allowBuilds:
  esbuild: true
  workerd: true
